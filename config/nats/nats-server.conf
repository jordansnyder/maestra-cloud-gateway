# Maestra Cloud Gateway — NATS Server Configuration
# Multi-tenant NATS with accounts for site isolation

# Server identity
server_name: maestra-cloud-gateway

# Client connections
port: 4223

# HTTP monitoring
http_port: 8223

# JetStream — persistent message storage
jetstream {
  store_dir: /data/jetstream
  max_mem_store: 1G
  max_file_store: 10G
}

# ─── Authentication & Accounts ──────────────────────────────────────────────
#
# Each site gets its own NATS account with isolated subject space.
# The SYSTEM account handles cross-account routing via the message router.
#
# In production, replace this with a NATS Account Server (nats-account-server)
# or decentralized JWT-based auth (nkeys + JWTs). This static config is for
# development and testing.
# ─────────────────────────────────────────────────────────────────────────────

accounts: {
  # System account — used by message router and control plane
  SYSTEM: {
    users: [
      {
        user: "router"
        password: "$ROUTER_NATS_PASSWORD"
      }
      {
        user: "control-plane"
        password: "$CONTROL_PLANE_NATS_PASSWORD"
      }
    ]
    exports: [
      # Export subjects that sites can import (receive)
      { stream: "cloud.broadcast.>" }
    ]
    imports: []
  }

  # Template for site accounts — in production, these are created dynamically
  # by the control plane via NATS Account Server or JWT operator
  SITE_TEMPLATE: {
    users: [
      {
        user: "site-agent"
        password: "$SITE_AGENT_PASSWORD"
      }
    ]
    exports: [
      # Sites export their messages to the SYSTEM account for routing
      { stream: "cloud.site.*.>" }
    ]
    imports: [
      # Sites import broadcasts from the SYSTEM account
      { stream: { account: SYSTEM, subject: "cloud.broadcast.>" } }
    ]
  }
}

# System account for internal services
system_account: SYSTEM

# ─── Authorization ───────────────────────────────────────────────────────────

authorization {
  # Default permissions (deny all)
  default_permissions {
    publish {
      deny: [">"]
    }
    subscribe {
      deny: [">"]
    }
  }
}

