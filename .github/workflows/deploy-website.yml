name: Website Build Check

# Railway auto-deploys the website on push to main via its GitHub integration
# (Root Directory = services/website, watch path services/website/** — see
# deploy/railway/DEPLOY.md). This workflow therefore only VALIDATES the build;
# it does not deploy. The previous `railway up` CLI job was a redundant second
# deploy path and failed on every push because RAILWAY_TOKEN was never set.

on:
  push:
    branches: [main]
    paths: ['services/website/**']
  pull_request:
    paths: ['services/website/**']

jobs:
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/website/package-lock.json
      - run: npm ci
        working-directory: services/website
      - run: npm run build
        working-directory: services/website
