# ─── Limits ──────────────────────────────────────────────────────────────────

max_connections: 1000
max_payload: 1MB
max_pending: 64MB

# Slow consumer handling
max_control_line: 4KB

# ─── Logging ─────────────────────────────────────────────────────────────────

debug: false
trace: false
logtime: true
log_file: "/data/logs/nats.log"
