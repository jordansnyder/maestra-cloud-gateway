# Maestra Cloud Gateway — NATS Server Configuration (Railway / cloud deploy)
#
# This is a SIMPLIFIED config for the initial Railway deployment:
#   - Binds to IPv6 (::) so it is reachable over Railway's private network.
#   - Logs to stdout (Railway captures container logs; no /data/logs file).
#   - No client auth — the Railway private network is already isolated and the
#     router/control-plane currently connect without credentials.
#
# The per-site NATS *account* isolation (SYSTEM / SITE_TEMPLATE, exports/imports)
# from config/nats/nats-server.conf is intentionally omitted here. It only matters
# once external sites connect through the Envoy/mTLS edge path, which is deferred
# past this first deploy. Re-introduce accounts + JWT/nkey auth when that lands.

server_name: maestra-cloud-gateway

# Listen on all interfaces incl. IPv6 — required for Railway private networking.
host: "::"
port: 4223

# HTTP monitoring (private only — do NOT expose a public domain for this).
http_port: 8223

# JetStream — persistent message storage. Mount a Railway volume at /data.
jetstream {
  store_dir: /data/jetstream
  max_mem_store: 256M
  max_file_store: 2G
}

max_connections: 1000
max_payload: 1MB
max_pending: 64MB
max_control_line: 4KB

# Log to stdout (Railway log aggregation), with timestamps.
logtime: true
debug: false
trace: false
